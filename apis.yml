name: Bit.io
description: Bit.io was a serverless, shareable PostgreSQL database platform that let developers
  spin up cloud Postgres databases in seconds, load and query data, and share them via a link,
  with programmatic access over the standard Postgres wire protocol. Founded by Adam Fletcher and
  Jonathan Mortensen and backed by Battery Ventures, bit.io was acquired by Databricks in May 2023;
  the standalone product was sunset on June 29, 2023 (database exports available through July 29,
  2023) and the team moved to Databricks. This profile is retained as a defunct/acquired network
  record — there is no live API, developer portal, documentation, or discovery surface to enrich.
